<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>BT Giriş Vize Soruları</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Tek sütun: konu seçimi, liste, ilerleme, numaralar, soru kartı */
:root{--bg:#fff;--fg:#14203a;--navy:#14286b;--soft:#eef1fb;--line:#c5cdea;--red:#b3261e;--redbg:#fde8e7;--green:#18793c;--greenbg:#dcf7e3;--yellow:#a87b00;--yellowbg:#fff3b8}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 Inter,system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:20px;color:var(--navy);margin:0 0 14px}
button,select{font:inherit;color:var(--navy);background:var(--bg);border:1px solid var(--line);cursor:pointer}
button:hover:not(:disabled){border-color:var(--navy)}
button:focus-visible,select:focus-visible{outline:3px solid #6b83d6;outline-offset:2px}
button:disabled{cursor:default;opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:8px}
.pill{border-radius:99px;padding:7px 15px;font-size:13px;font-weight:500}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
select{display:block;width:100%;max-width:450px;border-radius:99px;padding:8px 14px;margin:12px 0}
.bar{height:5px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy)}
#score{font-weight:700;color:var(--navy);margin:12px 0 8px;font-variant-numeric:tabular-nums}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
#grid button{height:34px;border-radius:9px;font-size:12px;padding:0;font-variant-numeric:tabular-nums}
#grid button.ok{background:var(--greenbg);border-color:var(--green);color:var(--green)}
#grid button.peek{background:var(--yellowbg);border-color:var(--yellow);color:var(--fg)}
#grid button.no{background:var(--redbg);border-color:var(--red);color:var(--red)}
#grid button.cur{outline:3px solid #6b83d6;outline-offset:1px;font-weight:700}
#card{border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px;scroll-margin-top:12px;box-shadow:0 6px 24px #14286b14}
.head{display:flex;justify-content:space-between;gap:10px;color:var(--navy);font-weight:600}
#q{font-size:16px;margin:12px 0}
#opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:9px}
#opts button{text-align:left;padding:12px 15px;border-radius:11px;color:var(--fg)}
#opts b{color:var(--navy);margin-right:6px}
#opts button:disabled{opacity:1}
#opts button.ok{background:var(--greenbg);border-color:var(--green)}
#opts button.peek{background:var(--yellowbg);border-color:var(--yellow)}
#opts button.no{background:var(--redbg);border-color:var(--red)}
.nav{margin-top:14px}
#sol{background:var(--soft);border-radius:12px;padding:14px;margin-top:14px}
#reset{margin-top:16px}
</style>
<main>
<h1>Bilişim Teknolojilerine Giriş · Vize Örnek Soruları</h1>
<div class="row" id="cats"></div>
<select id="sel" aria-label="Soru seç"></select>
<div class="bar"><i id="fill"></i></div>
<div id="score" aria-live="polite"></div>
<div id="grid"></div>
<section id="card">
  <div class="head"><span id="cat"></span><span id="no"></span></div>
  <p id="q"></p>
  <div id="opts"></div>
  <div class="row nav"><button class="pill" id="prev">← Önceki</button><button class="pill" id="show"></button><button class="pill" id="next">Sonraki →</button></div>
  <div id="sol" hidden></div>
</section>
<button class="pill" id="reset">Baştan başla</button>
</main>
<script>
const Q=[{"s": "Bilgisayarın “beyni” olarak kabul edilen ve komutların yorumlanıp çalıştırılmasından sorumlu olan bileşen aşağıdakilerden hangisidir?", "o": ["RAM", "CPU", "Güç kaynağı", "Yonga seti", "BIOS çipi"], "a": 1, "e": "CPU (işlemci) komutları yorumlar ve çalıştırır.", "k": "Donanım"}, {"s": "Klavye, fare, akıllı bileklik ve mikrofon gibi birimler donanım olarak hangi bileşen grubunda yer alır?", "o": ["Çıktı birimleri", "Dahili bileşenler", "Depolama birimleri", "Giriş birimleri", "Güç birimleri"], "a": 3, "e": "Klavye, fare, mikrofon ve akıllı bileklik bilgisayara veri gönderir; bu yüzden giriş birimidir.", "k": "Donanım"}, {"s": "Bilgisayar kapatıldığında içeriği silinmeyen (kalıcı) bellek türü aşağıdakilerden hangisidir?", "o": ["ROM", "DDR4 SDRAM", "DRAM", "SDRAM", "GDDR SDRAM"], "a": 0, "e": "ROM kalıcı bellektir. RAM türleri güç kesilince içeriğini kaybeder.", "k": "Donanım"}, {"s": "Yonga setinde, CPU’nun sabit diskler ve USB bağlantı noktaları gibi daha yavaş cihazlarla iletişim kurmasına izin veren bileşen aşağıdakilerden hangisidir?", "o": ["Kuzey köprüsü", "CMOS pili", "PCI yuvası", "BIOS çipi", "Güney köprüsü"], "a": 4, "e": "Güney köprüsü sabit disk ve USB gibi daha yavaş aygıtları yönetir. Kuzey köprüsü RAM ve ekran kartı gibi hızlı bileşenlerle ilgilenir.", "k": "Donanım"}, {"s": "Bilgisayar güç kaynağının temel görevi aşağıdakilerden hangisidir?", "o": ["DC gücünü AC gücüne dönüştürmek", "Verileri geçici olarak saklamak", "AC gücünü daha düşük gerilimli DC gücüne dönüştürmek", "İşlemciyi soğutmak", "Görüntü sinyali üretmek"], "a": 2, "e": "Güç kaynağı prizden gelen AC gerilimi bileşenlerin kullandığı düşük DC gerilime çevirir.", "k": "Donanım"}, {"s": "Hızı dakikada devir (RPM) cinsinden ölçülen, manyetik plakalardan oluşan geleneksel depolama aygıtı aşağıdakilerden hangisidir?", "o": ["Sabit disk sürücüsü (HDD)", "Katı hal sürücüsü (SSD)", "Optik sürücü", "Flash bellek kartı", "ROM çipi"], "a": 0, "e": "HDD dönen manyetik plakalar kullanır ve hızı RPM ile ölçülür.", "k": "Donanım"}, {"s": "Aşağıdakilerden hangisi aktif soğutma çözümüne örnektir?", "o": ["Isı emici (heat sink)", "Bileşenin çalışma hızını azaltmak", "Fansız soğutma", "Kasa fanı", "Termal macun"], "a": 3, "e": "Aktif soğutma enerji harcayan parça kullanır; kasa fanı buna örnektir.", "k": "Donanım"}, {"s": "Bilgisayar açıldığında BIOS’un temel donanım bileşenlerini kontrol etmesine ne ad verilir?", "o": ["CMOS", "POST", "TPM", "RAID", "NAT"], "a": 1, "e": "POST (Power-On Self Test), açılışta temel donanımın kontrol edilmesidir.", "k": "Donanım"}, {"s": "Bilgisayarın saat ve tarihinin sürekli yanlış olması hangi bileşenin zayıfladığını gösterebilir?", "o": ["Güç kaynağı", "RAM modülü", "CPU fanı", "Sabit disk", "CMOS pili"], "a": 4, "e": "CMOS pili saat, tarih ve ayarları korur. Zayıflayınca bunlar bozulur.", "k": "Donanım"}, {"s": "Sorun giderme sürecinin ilk adımı aşağıdakilerden hangisidir?", "o": ["Çözümü uygulamak", "Bulguları belgelendirmek", "Sorunu tanımlamak", "Tam sistem işlevselliğini doğrulamak", "Teoriyi test etmek"], "a": 2, "e": "Sorun gidermede önce sorun tanımlanır.", "k": "Sorun Giderme"}, {"s": "Bilgisayarların içinde çalışırken elektrostatik deşarj (ESD) kaynaklı hasarı önlemek için aşağıdakilerden hangisi kullanılmalıdır?", "o": ["Halı kaplı zemin", "Antistatik bilek kayışı", "Takılı bırakılmış güç kablosu", "Metal saat ve bilezik", "Sıvı temizleyici sprey"], "a": 1, "e": "Antistatik bileklik vücuttaki statik yükü güvenli biçimde boşaltır.", "k": "Güvenlik & Bakım"}, {"s": "Kasa içinde biriken toz bilgisayarda en çok hangi soruna yol açabilir?", "o": ["Dosyaların silinmesi", "CMOS ayarlarının sıfırlanması", "RAM’in uçucu olması", "IP adresi çakışması", "Hava akışının azalması ve aşırı ısınma"], "a": 4, "e": "Toz hava akışını engeller ve ısının dışarı atılmasını zorlaştırır.", "k": "Güvenlik & Bakım"}, {"s": "Harici ekranda görüntü alamayan bir dizüstü bilgisayarda harici ekranı etkinleştirmek için aşağıdakilerden hangisi denenebilir?", "o": ["Fn tuşu ile birlikte ilgili işlev tuşuna basmak", "Ctrl + Alt + Del tuşlarına basmak", "Num Lock tuşunu açmak", "Caps Lock tuşunu açmak", "Windows + L tuşlarına basmak"], "a": 0, "e": "Dizüstülerde harici ekran çıkışı genellikle Fn ve ilgili işlev tuşuyla açılır.", "k": "Sorun Giderme"}, {"s": "Ev, okul veya ofis gibi sınırlı bir alandaki cihazları birbirine bağlayan ağ türü aşağıdakilerden hangisidir?", "o": ["PAN", "WAN", "MAN", "LAN", "VPN"], "a": 3, "e": "LAN (yerel alan ağı) ev, okul, ofis gibi sınırlı alanları kapsar.", "k": "Ağ"}, {"s": "Bir bilgisayarı kablolu veya kablosuz olarak bir ağa bağlayan kart aşağıdakilerden hangisidir?", "o": ["Ses adaptörü", "Ağ arayüz kartı (NIC)", "Yakalama kartı", "TV alıcısı kartı", "eSATA kartı"], "a": 1, "e": "NIC (ağ arayüz kartı) bilgisayarı ağa bağlar.", "k": "Ağ"}, {"s": "Alan adlarını IP adreslerine çeviren sistem aşağıdakilerden hangisidir?", "o": ["DHCP", "SMTP", "HTTP", "FTP", "DNS"], "a": 4, "e": "DNS alan adını IP adresine çevirir.", "k": "Ağ"}, {"s": "DHCP’nin ağdaki temel görevi aşağıdakilerden hangisidir?", "o": ["Alan adlarını IP adreslerine çevirmek", "E-postaları alıcıya iletmek", "Cihazlara IP adresi ve diğer ağ ayarlarını otomatik olarak atamak", "Dosyaları şifreleyerek aktarmak", "Ağ trafiğinin kopyasını almak"], "a": 2, "e": "DHCP, IP adresi ve diğer ağ ayarlarını otomatik dağıtır.", "k": "Ağ"}, {"s": "Ethernet bağlantılarında UTP kabloların sonlandırılmasında yaygın olarak kullanılan konektör aşağıdakilerden hangisidir?", "o": ["RJ-45", "RJ-11", "BNC", "ST", "LC"], "a": 0, "e": "UTP Ethernet kablolarında RJ-45 kullanılır. RJ-11 telefon hattı içindir.", "k": "Ağ"}, {"s": "Ağdaki cihazlar arasındaki bağlantı durumunu test etmek için kullanılan ping komutu hangi protokolün altyapısını kullanır?", "o": ["DHCP", "SMTP", "ICMP", "FTP", "HTTP"], "a": 2, "e": "Ping, ICMP yankı isteği ve yanıtı mesajlarını kullanır.", "k": "Ağ"}, {"s": "Elektrikli cihazlarda yangın çıkması durumunda öncelik aşağıdakilerden hangisi olmalıdır?", "o": ["Pahalı donanımları kurtarmak", "Verileri yedeklemek", "Yangının nedenini belgelendirmek", "Can güvenliğini sağlamak", "Garanti belgelerini toplamak"], "a": 3, "e": "Her durumda öncelik can güvenliğidir.", "k": "Güvenlik & Bakım"}, {"s": "Tehlikeli maddelerin güvenli kullanımı ve yönetimi hakkında bilgi sağlayan belge aşağıdakilerden hangisidir?", "o": ["Güvenlik Bilgi Formu (SDS)", "İş emri", "Onarım geçmişi", "Teknisyen günlüğü", "Cihaz kullanım kılavuzu"], "a": 0, "e": "SDS, tehlikeli maddenin güvenli kullanımı ve bertarafı hakkında bilgi verir.", "k": "Güvenlik & Bakım"}, {"s": "Bilgisayar üzerinde çalışmaya başlamadan önce uygulanması gereken temel güvenlik önlemi aşağıdakilerden hangisidir?", "o": ["Kasayı çalışır durumdayken açmak", "Metal takıları üzerinde tutmak", "Cihazı kapatıp güç bağlantısını kesmek", "Güç kaynağının içini açmak", "Temizlik sıvısını doğrudan cihaza püskürtmek"], "a": 2, "e": "Çalışmadan önce cihaz kapatılır ve güç bağlantısı kesilir.", "k": "Güvenlik & Bakım"}, {"s": "Bakım sırasında güç kaynağının içinin açılmaması gerekir. Bunun nedeni aşağıdakilerden hangisidir?", "o": ["İç bileşenlerin yalnızca üretici tarafından üretilebilmesi", "Güç kaynağı içinde BIOS ayarlarının saklanması", "Açıldığında bilgisayarın garanti kapsamına girmesi", "Kapağın açılmasının soğutma fanını durdurması", "Fiş çekilmiş olsa bile tehlikeli elektrik yükünün kalabilmesi"], "a": 4, "e": "Güç kaynağındaki kondansatörler fiş çekildikten sonra da yük tutabilir.", "k": "Güvenlik & Bakım"}, {"s": "Bir teknisyenin kullanıcı verilerini silecek veya sistemi sıfırlayacak bir işlemi uygulamadan önce yapması gereken aşağıdakilerden hangisidir?", "o": ["Kullanıcıya haber vermeden işlemi uygulamak", "Yapılacak müdahaleyi kullanıcıya açıklayıp açık onay almak", "İşlemi yalnızca kendi notlarına kaydetmek", "Önce tüm verileri silmek", "Kullanıcının şifresini başkalarıyla paylaşmak"], "a": 1, "e": "Veri silebilecek her işlemden önc
